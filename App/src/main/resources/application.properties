# ========================
# APPLICATION
# ========================
spring.application.name=Team Task Manager
server.port=${PORT:8080}

# ========================
# DATASOURCE (PostgreSQL)
# ========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:8850275853@ss}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ========================
# THYMELEAF
# ========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET:4a6f686e446f6553656372657431323334353637383930313233343536373839304a6f686e446f65}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================
# LOGGING (Production)
# ========================
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.ethara=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
