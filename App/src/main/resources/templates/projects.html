<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects - Manage your team projects">
    <title>Projects — Team Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">&#9889; TaskManager</a>
        <div class="navbar-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/projects" class="active">Projects</a>
            <a href="/admin" sec:authorize="hasRole('ADMIN')">Admin</a>
            <div class="user-badge">
                <div class="user-avatar" th:text="${#strings.substring(userName, 0, 1)}">U</div>
                <span th:text="${userName}">User</span>
            </div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>&#128194; Projects</h2>
            <button class="btn-primary" style="width:auto; padding:0.7rem 1.5rem;" onclick="openModal('createProjectModal')">+ New Project</button>
        </div>

        <div th:if="${#lists.isEmpty(projects)}" class="empty-state glass-card" style="padding:3rem;">
            <div class="icon">&#128194;</div>
            <h4>No projects yet</h4>
            <p>Create your first project to get started!</p>
        </div>

        <div class="project-grid">
            <a th:each="project : ${projects}" th:href="@{/projects/{id}/tasks(id=${project.id})}" style="text-decoration:none; color:inherit;">
                <div class="project-card glass-card">
                    <h3 th:text="${project.name}">Project Name</h3>
                    <p th:text="${project.description != null ? project.description : 'No description'}">Description</p>
                    <div class="project-meta">
                        <span>By <strong th:text="${project.createdByName}">Creator</strong></span>
                        <span th:if="${project.createdAt != null}" th:text="${#temporals.format(project.createdAt, 'MMM dd, yyyy')}">Date</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- CREATE PROJECT MODAL -->
    <div id="createProjectModal" class="modal-overlay">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3>Create New Project</h3>
                <button class="modal-close" onclick="closeModal('createProjectModal')">&times;</button>
            </div>
            <div id="modalAlert" class="alert" style="display:none;"></div>
            <form onsubmit="handleCreateProject(event)">
                <div class="form-group">
                    <label for="projectName">Project Name</label>
                    <input type="text" id="projectName" class="form-control" placeholder="My Awesome Project" required>
                </div>
                <div class="form-group">
                    <label for="projectDesc">Description</label>
                    <textarea id="projectDesc" class="form-control" rows="3" placeholder="What's this project about?" style="resize:vertical; min-height:80px;"></textarea>
                </div>
                <button type="submit" class="btn-primary">Create Project</button>
            </form>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
